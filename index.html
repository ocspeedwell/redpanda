<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redpanda Technologies Ltd</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050608;color:#fff;font-family:Arial,sans-serif}.s{position:fixed;inset:0;display:grid;place-items:center;isolation:isolate;background:radial-gradient(circle at 50% 45%,#29100f 0,#0b0d10 31%,#030405 72%)}.grid{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle,#000,transparent 72%)}.ring{position:absolute;width:min(680px,82vw);aspect-ratio:1;border:1px solid #ff3b3028;border-radius:50%;animation:spin 22s linear infinite}.ring:before,.ring:after{content:"";position:absolute;inset:8%;border:1px dashed #ffffff15;border-radius:50%}.ring:after{inset:22%;border-style:solid;border-color:#ff3b3020}.dot{position:absolute;width:7px;height:7px;background:#f23830;border-radius:50%;top:-4px;left:50%;box-shadow:0 0 24px #f23830}.stage{position:relative;z-index:2;text-align:center;width:min(860px,92vw);transition:.15s}.logo{width:min(690px,88vw);opacity:0;filter:blur(14px);transform:scale(.82);mix-blend-mode:screen;animation:reveal 1.7s .2s cubic-bezier(.16,1,.3,1) forwards}.line{height:1px;width:0;margin:18px auto;background:linear-gradient(90deg,transparent,#f23830,transparent);animation:line 1.2s 1.1s forwards}.k{opacity:0;color:#a4a8af;font-size:9px;letter-spacing:.48em;animation:up .8s 1.5s forwards}.enter{opacity:0;margin-top:30px;padding:16px 27px;border:1px solid #ffffff42;background:#080a0d99;color:#fff;font-size:10px;letter-spacing:.32em;cursor:pointer;animation:up .8s 1.85s forwards;transition:.3s}.enter:hover{background:#f23830;border-color:#f23830;box-shadow:0 0 40px #f2383044;letter-spacing:.4em}.meta{position:absolute;font-size:7px;letter-spacing:.22em;color:#5d626b;line-height:1.8}.tl{top:25px;left:28px}.br{bottom:25px;right:28px;text-align:right}.scan{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#f23830,transparent);animation:scan 5s 2s infinite}.s.exit .stage{animation:out .7s forwards}.s.exit{animation:fade .85s .15s forwards}@keyframes reveal{to{opacity:1;filter:none;transform:scale(1)}}@keyframes line{to{width:min(430px,60vw)}}@keyframes up{to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes scan{0%{top:5%;opacity:0}20%{opacity:.4}70%{top:92%;opacity:0}100%{opacity:0}}@keyframes out{to{opacity:0;filter:blur(10px);transform:scale(1.14)}}@keyframes fade{to{opacity:0}}@media(max-width:600px){.meta{font-size:6px}.ring{width:95vw}.k{font-size:7px;letter-spacing:.32em}}
</style></head><body><main class="s" id="s"><div class="grid"></div><div class="scan"></div><div class="ring"><i class="dot"></i></div><div class="meta tl">REDPANDA / 2026<br>TECHNOLOGY · SYSTEMS · INTELLIGENCE</div><div class="meta br">HALIFAX · LISBON · DELAWARE<br>NAIROBI · LAGOS · OWERRI</div><section class="stage"><img class="logo" src="assets/redpanda-logo.png" alt="Redpanda Technologies Limited"><div class="line"></div><div class="k">IDEAS INTO INTELLIGENT SYSTEMS</div><button class="enter" id="e">ENTER &nbsp;↗</button></section></main><script>
let busy=false,s=document.getElementById("s");function go(){if(busy)return;busy=true;s.classList.add("exit");setTimeout(()=>location.href="main.html",780)}document.getElementById("e").onclick=go;document.addEventListener("keydown",e=>{if(e.key==="Enter")go()});document.addEventListener("mousemove",e=>{let x=(e.clientX/innerWidth-.5)*8,y=(e.clientY/innerHeight-.5)*8;document.querySelector(".stage").style.transform=`translate(${x}px,${y}px)`});
</script></body></html>
