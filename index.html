<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redpanda Technologies Ltd</title><link rel="icon" href="assets/favicon.ico"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#020305;font-family:Arial}.s{position:fixed;inset:0;background:#020305}.bg,.art{position:absolute;inset:0;background:url("assets/redpanda-landing.png") center/cover no-repeat}.bg{inset:-4%;filter:blur(18px) brightness(.3);opacity:.75;animation:bg 2s forwards}.art{background-size:contain;opacity:0;transform:scale(1.12);filter:blur(10px);animation:reveal 1.8s .1s cubic-bezier(.16,1,.3,1) forwards}.v{position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,#000b 100%)}.sweep{position:absolute;top:-30%;left:-50%;width:35%;height:160%;background:linear-gradient(90deg,transparent,#ffffff30,#ff351825,transparent);transform:rotate(18deg);filter:blur(15px);animation:sweep 5s 1.5s infinite}.scan{position:absolute;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,#ff3c28,#fff,transparent);animation:scan 5s 2s infinite;opacity:0}.particles i{position:absolute;width:5px;height:5px;background:#ff3c28;box-shadow:0 0 14px #ff3c28;animation:float 4s infinite;opacity:0}.particles i:nth-child(1){left:20%;top:30%}.particles i:nth-child(2){left:27%;top:60%;animation-delay:1s}.particles i:nth-child(3){left:74%;top:30%;animation-delay:1.6s}.particles i:nth-child(4){left:79%;top:62%;animation-delay:.6s}.enter{position:absolute;z-index:4;left:50%;bottom:7.8%;transform:translateX(-50%) translateY(12px);width:235px;height:58px;border:1px solid #ff735f;border-radius:35px;background:#16050499;color:#fff;letter-spacing:.38em;cursor:pointer;opacity:0;animation:show .7s 1.9s forwards;transition:.3s}.enter:hover{background:#ef3024;box-shadow:0 0 35px #ff351899;letter-spacing:.48em}.s.exit{animation:exit .75s forwards}@keyframes reveal{to{opacity:1;transform:scale(1);filter:none}}@keyframes bg{to{transform:scale(1.05)}}@keyframes sweep{from{left:-50%}to{left:120%}}@keyframes scan{0%{top:10%;opacity:0}20%{opacity:.5}75%{top:88%;opacity:0}100%{opacity:0}}@keyframes float{0%,100%{opacity:0;transform:translateY(30px)}40%{opacity:.8}80%{transform:translate(30px,-40px)}}@keyframes show{to{opacity:1;transform:translateX(-50%) translateY(0)}}@keyframes exit{to{opacity:0;transform:scale(1.08);filter:blur(10px)}}@media(max-width:700px){.art{background-size:cover}.enter{bottom:8%}}
</style></head><body><main class="s" id="s"><div class="bg"></div><div class="art"></div><div class="v"></div><div class="sweep"></div><div class="scan"></div><div class="particles"><i></i><i></i><i></i><i></i></div><button class="enter" id="e">ENTER &nbsp;→</button></main><script>let b=0;function go(){if(b)return;b=1;document.getElementById("s").classList.add("exit");setTimeout(()=>location.href="home.html",700)}document.getElementById("e").onclick=go;document.onkeydown=x=>{if(x.key==="Enter")go()}</script></body></html>
