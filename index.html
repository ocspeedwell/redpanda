<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redpanda Technologies Ltd</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030405;color:#fff;font-family:Arial}.s{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#25100e,#090b0e 32%,#020304 72%)}.grid{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:58px 58px;mask-image:radial-gradient(circle,#000,transparent 72%)}.ring{position:absolute;width:min(760px,88vw);aspect-ratio:1;border:1px solid #f1322828;border-radius:50%;animation:spin 28s linear infinite}.ring:before{content:"";position:absolute;inset:10%;border:1px dashed #ffffff15;border-radius:50%}.stage{position:relative;width:min(850px,94vw);aspect-ratio:1.5}.p{position:absolute;inset:0;background:url("assets/redpanda-logo.png") center/contain no-repeat;opacity:0}.animal{clip-path:polygon(18% 0,80% 0,80% 58%,18% 58%);animation:a 1.35s .2s cubic-bezier(.16,1,.3,1) forwards}.red{clip-path:polygon(4% 54%,43% 54%,43% 80%,4% 80%);animation:l 1.1s .5s cubic-bezier(.16,1,.3,1) forwards}.panda{clip-path:polygon(40% 54%,96% 54%,96% 80%,40% 80%);animation:r 1.1s .65s cubic-bezier(.16,1,.3,1) forwards}.tech{clip-path:polygon(8% 76%,94% 76%,94% 91%,8% 91%);animation:u 1s .95s forwards}.tag{clip-path:polygon(7% 88%,94% 88%,94% 100%,7% 100%);animation:u 1s 1.2s forwards}.final{animation:f .5s 2.15s forwards;filter:drop-shadow(0 0 28px #f1322830)}.energy{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 60px 25px #f13228;animation:e .9s 1.85s}.enter{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);opacity:0;padding:15px 29px;background:#06080aaa;border:1px solid #ffffff44;color:white;letter-spacing:.35em;font-size:10px;cursor:pointer;animation:show .7s 2.7s forwards;transition:.3s}.enter:hover{background:#f13228;border-color:#f13228;box-shadow:0 0 40px #f1322848;letter-spacing:.43em}.meta{position:absolute;font-size:7px;letter-spacing:.2em;color:#5c626b}.tl{top:25px;left:28px}.br{bottom:25px;right:28px;text-align:right}.s.exit{animation:bye .8s forwards}@keyframes a{from{opacity:0;transform:translateY(-180px) scale(.7);filter:blur(14px)}to{opacity:1;transform:none}}@keyframes l{from{opacity:0;transform:translateX(-300px);filter:blur(10px)}to{opacity:1;transform:none}}@keyframes r{from{opacity:0;transform:translateX(300px);filter:blur(10px)}to{opacity:1;transform:none}}@keyframes u{from{opacity:0;transform:translateY(120px);filter:blur(8px)}to{opacity:1;transform:none}}@keyframes f{to{opacity:1}}@keyframes e{30%{opacity:.8}to{opacity:0;transform:scale(16)}}@keyframes show{to{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bye{to{opacity:0;filter:blur(10px);transform:scale(1.08)}}@media(max-width:600px){.stage{width:100vw}.meta{font-size:5px}.ring{width:98vw}}</style></head><body><main class="s" id="s"><div class="grid"></div><div class="ring"></div><div class="meta tl">REDPANDA / SYSTEM INITIALISATION<br>ENGINEERING TOMORROW</div><div class="meta br">TECHNOLOGY · SYSTEMS · INTELLIGENCE<br>RP // 001</div><section class="stage"><div class="p animal"></div><div class="p red"></div><div class="p panda"></div><div class="p tech"></div><div class="p tag"></div><div class="p final"></div><div class="energy"></div></section><button class="enter" id="go">ENTER ↗</button></main><script>let b=false;function go(){if(b)return;b=true;document.getElementById("s").classList.add("exit");setTimeout(()=>location.href="home.html",720)}document.getElementById("go").onclick=go;document.onkeydown=e=>{if(e.key==="Enter")go()}</script></body></html>
