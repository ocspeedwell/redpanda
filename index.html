<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redpanda Technologies Ltd | Engineering Tomorrow</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030405;color:#fff;font-family:Arial,sans-serif}
:root{--red:#f13228}
.splash{position:fixed;inset:0;display:grid;place-items:center;isolation:isolate;background:radial-gradient(circle at 50% 44%,#23100f 0,#090b0e 31%,#020304 73%)}
.grid{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:58px 58px;mask-image:radial-gradient(circle,#000,transparent 72%)}
.halo{position:absolute;width:min(760px,86vw);aspect-ratio:1;border:1px solid #f1322824;border-radius:50%;animation:spin 28s linear infinite}
.halo:before,.halo:after{content:"";position:absolute;border-radius:50%;inset:9%;border:1px dashed #ffffff12}.halo:after{inset:24%;border-style:solid;border-color:#f1322818}
.dot{position:absolute;width:6px;height:6px;background:var(--red);border-radius:50%;top:-3px;left:50%;box-shadow:0 0 20px var(--red)}
.stage{position:relative;width:min(850px,92vw);aspect-ratio:1.5;z-index:2}
.piece{position:absolute;inset:0;background:url("assets/redpanda-logo-transparent.png") center/contain no-repeat;opacity:0;will-change:transform,filter,opacity}
/* Each layer reveals only one physical region of the original artwork. */
.panda{clip-path:polygon(20% 0,78% 0,78% 58%,20% 58%);animation:pandaIn 1.35s .2s cubic-bezier(.16,1,.3,1) forwards}
.red{clip-path:polygon(4% 55%,43% 55%,43% 79%,4% 79%);animation:redIn 1.1s .48s cubic-bezier(.16,1,.3,1) forwards}
.pandaword{clip-path:polygon(40% 55%,96% 55%,96% 79%,40% 79%);animation:wordIn 1.15s .62s cubic-bezier(.16,1,.3,1) forwards}
.tech{clip-path:polygon(11% 77%,91% 77%,91% 90%,11% 90%);animation:techIn 1.05s .92s cubic-bezier(.16,1,.3,1) forwards}
.tag{clip-path:polygon(8% 88%,92% 88%,92% 100%,8% 100%);animation:tagIn 1.05s 1.16s cubic-bezier(.16,1,.3,1) forwards}
.slash1{clip-path:polygon(8% 88%,30% 88%,30% 100%,8% 100%);animation:leftLine 1s 1.25s cubic-bezier(.16,1,.3,1) forwards}
.slash2{clip-path:polygon(70% 88%,93% 88%,93% 100%,70% 100%);animation:rightLine 1s 1.25s cubic-bezier(.16,1,.3,1) forwards}
.final{animation:finalIn .65s 2.12s ease forwards;filter:drop-shadow(0 0 25px #f1322826)}
.energy{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 60px 24px #f13228;animation:energy 1s 1.8s ease-out forwards}
.scan{position:absolute;left:12%;right:12%;height:1px;top:50%;opacity:0;background:linear-gradient(90deg,transparent,#fff,var(--red),transparent);animation:scan 1.2s 1.65s ease-out forwards}
.enter{position:absolute;z-index:4;left:50%;bottom:7%;transform:translate(-50%,15px);opacity:0;padding:15px 28px;border:1px solid #ffffff42;background:#050608aa;color:#fff;font-size:10px;letter-spacing:.32em;cursor:pointer;animation:enterIn .8s 2.65s forwards;transition:.3s}
.enter:hover{background:var(--red);border-color:var(--red);box-shadow:0 0 38px #f1322844;letter-spacing:.42em}
.status{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);font-size:6px;letter-spacing:.28em;color:#555b64;opacity:0;animation:enterIn .8s 2.9s forwards}
.meta{position:absolute;font-size:7px;letter-spacing:.2em;color:#555b64;line-height:1.8}.tl{left:26px;top:24px}.br{right:26px;bottom:24px;text-align:right}
.splash.exit .stage,.splash.exit .enter{animation:exit .65s forwards}.splash.exit{animation:fade .85s .1s forwards}
@keyframes pandaIn{0%{opacity:0;transform:translateY(-180px) scale(.68) rotate(-7deg);filter:blur(15px)}70%{opacity:1}100%{opacity:1;transform:none;filter:none}}
@keyframes redIn{0%{opacity:0;transform:translateX(-280px) rotate(-5deg);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
@keyframes wordIn{0%{opacity:0;transform:translateX(300px) rotate(4deg);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
@keyframes techIn{0%{opacity:0;transform:translateY(130px) scaleX(.65);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
@keyframes tagIn{0%{opacity:0;transform:translateY(100px);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
@keyframes leftLine{0%{opacity:0;transform:translateX(-180px)}100%{opacity:1;transform:none}}
@keyframes rightLine{0%{opacity:0;transform:translateX(180px)}100%{opacity:1;transform:none}}
@keyframes finalIn{0%{opacity:0}100%{opacity:1}}
@keyframes energy{0%{opacity:0;transform:scale(.1)}30%{opacity:.8}100%{opacity:0;transform:scale(16)}}
@keyframes scan{0%{opacity:0;transform:translateY(-100px) scaleX(.2)}35%{opacity:.8}100%{opacity:0;transform:translateY(110px) scaleX(1)}}
@keyframes enterIn{to{opacity:1;transform:translate(-50%,0)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes exit{to{opacity:0;transform:scale(1.12);filter:blur(12px)}}@keyframes fade{to{opacity:0}}
@media(max-width:600px){.stage{width:98vw}.halo{width:98vw}.meta{font-size:5px}.enter{bottom:10%}}
@media(prefers-reduced-motion:reduce){.piece,.final,.enter,.status{animation-delay:0s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<main class="splash" id="splash">
<div class="grid"></div><div class="halo"><i class="dot"></i></div>
<div class="meta tl">REDPANDA / SYSTEM INITIALISATION<br>ENGINEERING TOMORROW</div>
<div class="meta br">TECHNOLOGY · SYSTEMS · INTELLIGENCE<br>RP // 001</div>
<section class="stage">
  <div class="piece panda"></div><div class="piece red"></div><div class="piece pandaword"></div>
  <div class="piece tech"></div><div class="piece tag"></div><div class="piece slash1"></div><div class="piece slash2"></div>
  <div class="piece final"></div><div class="energy"></div><div class="scan"></div>
</section>
<button class="enter" id="enter">ENTER &nbsp;↗</button>
<div class="status">ASSEMBLY COMPLETE · REDPANDA ONLINE</div>
</main>
<script>
let busy=false;const s=document.getElementById("splash");
function go(){if(busy)return;busy=true;s.classList.add("exit");setTimeout(()=>location.href="main.html",760)}
document.getElementById("enter").onclick=go;document.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
document.addEventListener("mousemove",e=>{const x=(e.clientX/innerWidth-.5)*5,y=(e.clientY/innerHeight-.5)*5;document.querySelector(".stage").style.transform=`translate(${x}px,${y}px)`});
</script></body></html>
